name: Robot Store CI-CD and Observability

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'monitoring/**'
      - 'tracing/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-store-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout root project
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          echo "Shell syntax validation passed."

      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              *Path("monitoring").glob("*.yaml"),
              *Path("tracing").glob("*.yaml"),
          ]

          for file in files:
              with file.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(f"Valid YAML: {file}")

          if not files:
              raise SystemExit("No monitoring or tracing YAML files found.")
          PY

      - name: Check required deployment files
        run: |
          set -euo pipefail
          test -f scripts/10-deploy-robot-shop.sh
          test -f scripts/20-deploy-observability.sh
          test -f scripts/30-verify.sh
          test -f monitoring/kube-prometheus-stack-values.yaml
          test -f monitoring/loki-values.yaml
          test -f monitoring/fluent-bit-values.yaml
          test -f monitoring/robot-shop-alerts.yaml
          test -f tracing/jaeger-all-in-one.yaml
          echo "Required project files are present."

  deploy:
    name: Deploy to existing K3s cluster
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy application and observability stack over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/robot-store"

            echo "=== Confirming K3s and tools ==="
            sudo kubectl get nodes
            helm version --short

            echo "=== Updating root project ==="
            git fetch origin
            BRANCH="${{ github.ref_name }}"
            git pull --ff-only origin "$BRANCH"

            chmod +x scripts/*.sh

            echo "=== Checking prerequisites ==="
            ./scripts/00-check-prerequisites.sh

            echo "=== Deploying Robot Shop ==="
            ./scripts/10-deploy-robot-shop.sh

            echo "=== Deploying monitoring, logs, alerts and tracing ==="
            ./scripts/20-deploy-observability.sh

            echo "=== Waiting for workload rollout ==="
            sudo kubectl rollout status deployment/jaeger -n tracing --timeout=300s

            echo "=== Verifying application and observability ==="
            ./scripts/30-verify.sh

            echo "=== Deployment commands completed ==="
