name: Robot Store CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-store-deployment
  cancel-in-progress: false

env:
  APP_COMMIT: 55292e2199f2fb00a165b1f7d3045fe7f8922038

jobs:
  build:
    name: Build and push Robot Shop images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Instana Robot Shop source
        uses: actions/checkout@v4
        with:
          repository: instana/robot-shop
          ref: 55292e2199f2fb00a165b1f7d3045fe7f8922038
          path: app

      - name: Fix shipping Dockerfile base images
        run: |
          set -euo pipefail
          sed -i 's|^FROM openjdk:8-jdk$|FROM eclipse-temurin:8-jdk|' app/shipping/Dockerfile
          sed -i 's|^FROM debian:10 AS build$|FROM debian:11 AS build|' app/shipping/Dockerfile
          grep -n '^FROM ' app/shipping/Dockerfile

      - name: Verify source files
        run: |
          set -euo pipefail
          test -f app/docker-compose.yaml
          test -f app/K8s/helm/Chart.yaml
          echo "Robot Shop source and chart found."

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build custom images
        working-directory: app
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose.yaml build \
            mongodb catalogue user cart mysql shipping ratings payment dispatch web

      - name: Push custom images
        working-directory: app
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml push \
            mongodb catalogue user cart mysql shipping ratings payment dispatch web

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: robot-shop-chart
          path: app/K8s/helm/
          include-hidden-files: true

  render:
    name: Render Kubernetes manifests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Robot Shop source
        uses: actions/checkout@v4
        with:
          repository: instana/robot-shop
          ref: 55292e2199f2fb00a165b1f7d3045fe7f8922038
          path: app

      - name: Install Helm renderer
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Render chart as plain Kubernetes YAML
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${TAG::12}"

          helm template robot-shop app/K8s/helm \
            --namespace robot-shop \
            --set image.repo="$REPO" \
            --set image.version="$IMAGE_TAG" \
            --set redis.storageClassName=local-path \
            > robot-shop-rendered.yaml

          test -s robot-shop-rendered.yaml
          echo "Rendered Kubernetes manifests:"
          grep -E '^[[:space:]]*image:' robot-shop-rendered.yaml | sort -u

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: robot-shop-manifests
          path: robot-shop-rendered.yaml

  deploy:
    name: Deploy to K3s and observability
    needs: render
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: robot-shop-manifests
          path: deployment

      - name: Copy manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: deployment/robot-shop-rendered.yaml
          target: /tmp/
          strip_components: 1

      - name: Apply Kubernetes manifests
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/robot-store"

            echo "=== Check K3s ==="
            sudo kubectl get nodes

            echo "=== Create application namespace ==="
            sudo kubectl create namespace robot-shop \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            echo "=== Deploy application using kubectl ==="
            sudo kubectl apply -n robot-shop \
              -f /tmp/robot-shop-rendered.yaml

            echo "=== Update monitoring and tracing ==="
            chmod +x scripts/*.sh
            sudo bash scripts/20-deploy-observability.sh

            echo "=== Check application deployments ==="
            for deployment in $(sudo kubectl get deployments \
              -n robot-shop -o name); do
              sudo kubectl rollout status -n robot-shop \
                "$deployment" --timeout=300s
            done

            echo "=== Check Jaeger ==="
            sudo kubectl rollout status deployment/jaeger \
              -n tracing --timeout=300s

            echo "=== Verify all project components ==="
            sudo bash scripts/30-verify.sh

            echo "=== Final pod status ==="
            sudo kubectl get pods -n robot-shop
            sudo kubectl get pods -n monitoring
            sudo kubectl get pods -n tracing

            echo "Deployment completed."
