# Starter values; chart keys and plugin syntax are version-sensitive. Verify with `helm show values grafana/fluent-bit`.
config:
  service: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Parser            cri
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
  outputs: |
    [OUTPUT]
        Name                loki
        Match               *
        Host                loki
        Port                3100
        Labels              job=fluentbit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name']
        Line_Format         json
