# Starter values for a single-binary disposable lab. Chart schemas can change; compare with `helm show values grafana/loki`.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
  persistence:
    enabled: false
gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
